apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: argocd-k8s-hpa
  annotations:
    argocd.argoproj.io/syn-wave: "3"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: argocd-k8s-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
