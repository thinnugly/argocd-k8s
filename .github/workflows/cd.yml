name: CD

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Dockerhub Login
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
            
            - name: Build and Push
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                platform: linux/arm64
                tags: pacman2022/argocd-k8s:${{ github.sha }}

    update-gitops:
        name: Update Kustomize Manifests
        runs-on: ubuntu-latest
        needs: build-and-push
        # 1. Adicionada a permissão para o robô poder fazer o git push
        permissions:
          contents: write
        steps:
          - name: Checkout Code
            uses: actions/checkout@v3
            with:
                token: ${{ secrets.GITHUB_TOKEN }}

          - name: Install Kustomize
            run: curl -s "https://raw.githubusercontent.com/kubernetes-
                sigs/kustomize/master/hack/install_kustomize.sh" | bash

          - name: Update Image Tag on Kustomize
            run: |
                cd k8s/overlays/prod
                kustomize edit set image pacman2022/argocd-k8s=pacman2022/argocd-k8s:${{ github.sha }}

          - name: Commit and Push on Github
            run: |
                git config --global user.name "Github Actions Bot"
                git config --global user.email "bot@github.com"
                git add k8s/overlays/prod/kustomization.yaml
                git commit -m "ci: Update image tag to ${{ github.sha }} [skip ci]"
                git push

         
